databaseChangeLog:
  - changeSet:
      id: 002-create-tasks-table
      author: Artemov_AV

      createTable:
        tableName: tasks
        columns:
          - column:
              name: id
              type: BIGSERIAL
              constraints:
                primaryKey: true
                nullable: false

          - column:
              name: title
              type: VARCHAR(255)
              constraints:
                nullable: false

          - column:
              name: description
              type: VARCHAR(2000)

          - column:
              name: status
              type: VARCHAR(32)
              constraints:
                nullable: false

          - column:
              name: deadline
              type: DATE

          - column:
              name: owner_id
              type: BIGINT
              constraints:
                nullable: false

      addForeignKeyConstraint:
        baseTableName: tasks
        baseColumnNames: owner_id
        referencedTableName: users
        referencedColumnNames: id
        constraintName: fk_tasks_owner